# Ruff configuration.
#
# The rule set is pinned explicitly rather than left to the default: ruff's
# default widens between releases, and a lint job that starts failing on an
# unrelated dependency bump is noise. These are the rules that catch real
# defects; the broader opinionated families (ANN, D, PL, TRY, EM, FBT, DTZ)
# would add a lot of churn to code whose comments already carry the intent.
line-length = 100
target-version = "py310"
src = ["src", "tests"]

# `ruff format` rewrites fenced Python inside Markdown, so it would reflow the
# READMEs and the changelog's code samples to its own alignment. Declared here
# rather than passed as `--exclude` on every invocation, so a bare
# `ruff format .` -- in CI, in a pre-commit hook, or by hand -- leaves them alone.
exclude = ["README.md", "README.JP.md", "CHANGELOG.md"]

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]

ignore = [
    # The docstrings quote classical job-scheduler terminology in Japanese, where
    # full-width punctuation is correct. RUF001-003 mistake it for a typo.
    "RUF001",
    "RUF002",
    "RUF003",
]

[lint.per-file-ignores]
# Tests read long rule definitions at full width, and the `_Unused`-style
# renamed classes keep their historical names.
"tests/*" = ["E501"]
# `__init__.py`'s __all__ is grouped by layer (calendars / rules / timetable)
# with a comment above each group, and ruff reads those comments as unsorted
# entries. The grouping is deliberate: it mirrors the module layout and the
# documentation sections.
"src/airflow_timetables_calendar/__init__.py" = ["RUF022"]

[lint.isort]
known-first-party = ["airflow_timetables_calendar"]

[format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
