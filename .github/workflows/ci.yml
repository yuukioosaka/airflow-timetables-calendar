name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} / Airflow ${{ matrix.airflow }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Airflow 3.2 is the floor because the singledispatch hook that lets a
        # custom timetable supply its own serializer only exists from there.
        # 3.0/3.1 were tried and fail: `airflow.serialization.encoders` is
        # absent, and the implicit `timetable.serialize()` path raises
        # TimetableNotRegistered first. The matrix is what found this.
        #
        # 3.2 does not publish wheels for 3.13, so that pair is excluded rather
        # than left to fail on install.
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        airflow: ["3.2.*", "3.3.*"]
        exclude:
          - python-version: "3.10"
            airflow: "3.3.*"
          - python-version: "3.13"
            airflow: "3.2.*"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        # `[exchanges]` is installed so the exchange-calendar tests actually run
        # rather than skip, and `[test]` brings pytest and coverage.
        run: |
          python -m pip install --upgrade pip
          python -m pip install "apache-airflow==${{ matrix.airflow }}"
          python -m pip install -e ".[test,exchanges]"

      - name: Show versions
        run: python -c "import airflow, sys; print('airflow', airflow.__version__, '| python', sys.version)"

      - name: Run tests
        # Every xfail in the suite is strict, which is deliberate: the marks
        # record known bugs (see CHANGELOG.md) and must turn into failures the
        # moment one of those bugs is fixed, so the mark gets removed.
        run: python -m pytest -q --cov=airflow_timetables_calendar --cov-report=term-missing

  # `calendars.py` and `rules.py` contain no Airflow imports, which is what lets
  # another scheduler reuse the rule engine. The package __init__ does import
  # Airflow (it re-exports the timetable), so this job checks the modules'
  # imports by parsing them rather than by importing them without Airflow.
  airflow-free:
    name: Rule engine has no Airflow imports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Parse the reusable modules
        run: |
          python - <<'PY'
          import ast, pathlib, sys

          banned = {"airflow", "croniter"}
          failed = False
          for name in ("calendars", "rules"):
              path = pathlib.Path(f"src/airflow_timetables_calendar/{name}.py")
              tree = ast.parse(path.read_text(encoding="utf-8"))
              roots = set()
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      roots |= {a.name.split(".")[0] for a in node.names}
                  elif isinstance(node, ast.ImportFrom) and node.module:
                      roots.add(node.module.split(".")[0])
              found = roots & banned
              print(f"{name}.py imports: {sorted(roots)}")
              if found:
                  print(f"  ERROR: {name}.py imports {sorted(found)}", file=sys.stderr)
                  failed = True
          raise SystemExit(1 if failed else 0)
          PY

  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        # mypy needs Airflow installed to resolve the imports it type-checks
        # through, so this job installs the package properly rather than
        # type-checking against a stub-less environment.
        run: |
          python -m pip install --upgrade pip
          python -m pip install apache-airflow ruff mypy
          python -m pip install -e ".[exchanges]"

      - name: Ruff
        run: ruff check --output-format=github .

      - name: Ruff format
        # The Markdown files are excluded in `ruff.toml` rather than here: their
        # fenced Python is illustrative and wraps deliberately to stay readable,
        # and a bare `ruff format .` -- in CI, in a hook, or by hand -- has to
        # leave them alone.
        run: ruff format --check --diff .

      - name: Mypy
        run: mypy src/airflow_timetables_calendar
        continue-on-error: true  # annotations are not complete yet

  build:
    name: Build and validate the distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Check the metadata
        run: python -m twine check --strict dist/*

      - name: Verify the wheel installs and registers its entry point
        run: |
          python -m pip install dist/*.whl
          python -c "
          from importlib.metadata import entry_points, version
          print('installed', version('airflow-timetables-calendar'))
          eps = {ep.name: ep.value for ep in entry_points(group='airflow.plugins')}
          assert eps['calendar_timetable'].endswith('plugin:CalendarTimetablePlugin'), eps
          print('entry point OK:', eps['calendar_timetable'])
          "

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
