name: Publish to PyPI

on:
  push:
    tags: ["v*"]
  # Lets a maintainer dry-run the build without publishing.
  workflow_dispatch:
    inputs:
      confirm:
        description: "Publish to PyPI (leave unchecked to build only)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build the distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade build twine

      - name: Check that the tag matches the package version
        # A tag that disagrees with __version__ publishes a release whose files
        # do not match its name, which cannot be fixed after the fact.
        run: |
          python - <<'PY'
          import pathlib, re, os
          version = re.search(
              r'__version__\s*=\s*"([^"]+)"',
              pathlib.Path("src/airflow_timetables_calendar/__init__.py").read_text(),
          ).group(1)
          ref = os.environ.get("GITHUB_REF_NAME", "")
          print("package version:", version, "| ref:", ref)
          if ref.startswith("v") and ref[1:] != version:
              raise SystemExit(f"tag {ref!r} does not match __version__ {version!r}")
          PY

      - name: Build sdist and wheel
        run: python -m build

      - name: Check the metadata
        run: python -m twine check --strict dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Upload to PyPI
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.confirm
    runs-on: ubuntu-latest
    # Trusted publishing: no API token is stored. Configure the publisher at
    # https://pypi.org/manage/account/publishing/ with
    #   owner=yuukioosaka, repo=airflow-timetables-calendar,
    #   workflow=publish.yml, environment=pypi
    environment:
      name: pypi
      url: https://pypi.org/p/airflow-timetables-calendar
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Fails loudly if the version is already on PyPI rather than silently
          # no-oping, which is what makes a re-run of a tag obvious.
          attestations: true

  release:
    name: Create the GitHub release
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            dist/*
